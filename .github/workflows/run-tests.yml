name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1

  ty:
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install dependencies
      run: uv sync --dev -p ${{ matrix.python-version }}
    - name: Run ty
      run: uv run -p ${{ matrix.python-version }} ty check

  pytest:
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install dependencies
      run: uv sync --dev -p ${{ matrix.python-version }}
    - name: Run pytest
      run: |
        uv run -p ${{ matrix.python-version }} pytest -v ./tests ./training/tests

  timestamp-tooling:
    runs-on: ubuntu-24.04
    needs: pre-commit
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v7
    - run: uv sync --no-dev --python 3.11
    - run: uv pip install --python .venv/bin/python pytest pyyaml numba==0.67.0
    - run: .venv/bin/python -m pytest -q tests/test_timestamp_evaluation.py
