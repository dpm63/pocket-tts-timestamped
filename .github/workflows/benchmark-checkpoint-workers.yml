name: Benchmark checkpoint evaluation on GitHub workers

on:
  push:
    branches: [codex/checkpoint-runner-benchmark]
    paths:
      - .github/workflows/benchmark-checkpoint-workers.yml
      - scripts/benchmark_github_workers.py
      - scripts/benchmark_crisper_batch_adapter.py
      - scripts/benchmark-data/checkpoint-prompts.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tts-6l:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --no-dev --python 3.11
      - name: Benchmark 6-layer TTS and save audio for STT
        run: .venv/bin/python scripts/benchmark_github_workers.py tts english_2026-09 --audio-dir bench-audio --output bench-results/tts-6l.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tts-6l-results
          path: bench-results/tts-6l.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-audio
          path: bench-audio/*.wav
          retention-days: 2

  tts-24l:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --no-dev --python 3.11
      - name: Benchmark 24-layer TTS
        run: .venv/bin/python scripts/benchmark_github_workers.py tts english_2026-09_24l --output bench-results/tts-24l.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tts-24l-results
          path: bench-results/tts-24l.json
          if-no-files-found: ignore

  stt-small:
    needs: tts-6l
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: parakeet
            model: parakeet-tdt-0.6b-v3
            backend: ct2
            batch_size: 16
          - key: crisper-small-ct2
            model: crisperwhisper-2.0-small
            backend: ct2
            batch_size: 1
          - key: crisper-small-transformers
            model: crisperwhisper-2.0-small
            backend: transformers
            batch_size: 4
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --no-dev --python 3.11
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-audio
          path: bench-audio
      - name: Install Parakeet runtime
        if: matrix.key == 'parakeet'
        run: uv pip install --python .venv/bin/python 'nemo_toolkit[asr]'
      - name: Install CrisperWhisper CT2 runtime
        if: matrix.backend == 'ct2' && matrix.key != 'parakeet'
        run: uv pip install --python .venv/bin/python 'crisperwhisper[ct2,convert]==2.0.3'
      - name: Install CrisperWhisper Transformers runtime
        if: matrix.backend == 'transformers'
        run: uv pip install --python .venv/bin/python 'crisperwhisper[transformers]==2.0.3' 'ctranslate2-crisperwhisper>=4.7.1.post3,<5'
      - name: Benchmark word-timestamp transcription
        run: .venv/bin/python scripts/benchmark_github_workers.py stt '${{ matrix.model }}' --backend '${{ matrix.backend }}' --batch-size '${{ matrix.batch_size }}' --audio-dir bench-audio --output 'bench-results/${{ matrix.key }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stt-small-${{ matrix.key }}
          path: bench-results/${{ matrix.key }}.json
          if-no-files-found: ignore

  stt-large:
    needs: [tts-6l, stt-small]
    if: ${{ always() && needs.tts-6l.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --no-dev --python 3.11
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-audio
          path: bench-audio
      - uses: actions/download-artifact@v4
        with:
          pattern: stt-small-crisper-*
          path: small-results
          merge-multiple: true
      - name: Choose the faster Small backend
        id: choose
        run: |
          backend=$(python - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(path.read_text()) for path in Path('small-results').glob('*.json')]
          if not rows:
              raise SystemExit('Neither Small backend completed')
          best = min(rows, key=lambda row: row['seconds_per_sample'])
          print(best['backend'])
          PY
          )
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "Small winner: $backend"
      - name: Install selected CT2 runtime
        if: steps.choose.outputs.backend == 'ct2'
        run: uv pip install --python .venv/bin/python 'crisperwhisper[ct2,convert]==2.0.3'
      - name: Install selected Transformers runtime
        if: steps.choose.outputs.backend == 'transformers'
        run: uv pip install --python .venv/bin/python 'crisperwhisper[transformers]==2.0.3' 'ctranslate2-crisperwhisper>=4.7.1.post3,<5'
      - name: Benchmark Large with Small winner
        run: .venv/bin/python scripts/benchmark_github_workers.py stt crisperwhisper-2.0-large --backend '${{ steps.choose.outputs.backend }}' --batch-size ${{ steps.choose.outputs.backend == 'ct2' && 1 || 4 }} --audio-dir bench-audio --output bench-results/crisper-large.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stt-large-results
          path: bench-results/crisper-large.json
          if-no-files-found: ignore
